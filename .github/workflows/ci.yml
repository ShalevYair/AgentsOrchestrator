name: CI

"on":
  pull_request:
  push:
    branches: [main]

# Windows is a first-class target (ADR-011, docs/DECISIONS.md): a failure on
# windows-latest blocks merge exactly like a failure on ubuntu-latest — this
# matrix is not decorative.
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test (with coverage)
        run: pnpm test:coverage

      # TASKS.md P11-T5 — the cheap subset only (--tag=ci-cheap): 4 of the
      # 12 golden tasks, chosen to stay small/fast across every OS in the
      # matrix. Fails on a real >25% cost regression against the committed
      # evals/cost-baseline.json (see apps/evals/src/cost-baseline.ts) —
      # not on the full suite's per-run drift, which stays local/dev-only
      # (evals/history.jsonl, not checked here).
      - name: Eval cost regression (cheap subset)
        run: pnpm eval -- --tag=ci-cheap
