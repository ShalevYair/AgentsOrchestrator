name: CI

"on":
  pull_request:
  push:
    branches: [main]

# Windows is a first-class target (ADR-011, docs/DECISIONS.md): a failure on
# windows-latest blocks merge exactly like a failure on ubuntu-latest — this
# matrix is not decorative.
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test (with coverage)
        run: pnpm test:coverage
