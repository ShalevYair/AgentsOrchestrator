  creation): same "migration" recipe as migration-code-he, but
  deliverableShape.estimatedSize: xlarge scales up the coder stage's
  canned file content (more lines actually written, not just a bigger
  label) — covers P11-T2's "large output" scale for the code/creation
  combination.
tags: [large-output, code, creation, en]
recipeName: migration
userRequest: "Convert every file in the old format to the new format and confirm the migration is complete"
budgetTotal: 3000000
budgetLevel: deep
understanding:
