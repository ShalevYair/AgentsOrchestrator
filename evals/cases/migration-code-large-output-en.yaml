  deliverableShape:
    kind: files
    estimatedSize: xlarge
    structure: multi-file
  evidenceNeeds: []
  acceptanceCriteria:
    - "every file is fully converted to the new format"
  ambiguities: []
  riskFlags: ["large-output"]
assertions:
  maxTokensSpent: 26000
  maxDurationMs: 5000
